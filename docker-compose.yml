# Run: docker compose up -d to start local PostgreSQL for development
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: routesy
      POSTGRES_PASSWORD: routesy
      POSTGRES_DB: routesy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
