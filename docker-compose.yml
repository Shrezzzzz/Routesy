# Run: docker compose up -d to start local PostgreSQL for development
# ⚠ WARNING: These credentials are for local development only.
#   NEVER use these passwords in a staging or production environment.
#   Production deployments should use a managed database (e.g. Neon) with
#   strong, unique credentials stored in environment variables.
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: routesy
      POSTGRES_PASSWORD: routesy
      POSTGRES_DB: routesy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
